name: Jobbannons-bevakning

on:
  # Schemat sköts av cron-job.org via workflow_dispatch nedan.
  # GitHub Actions inbyggda schedule är borttagen för att undvika dubbelkörningar.
  workflow_dispatch:
    inputs:
      force:
        description: 'Visa alla nuvarande jobb (används vid lansering)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  bevaka:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repo
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Installera Playwright-webbläsare
        run: playwright install chromium --with-deps

      - name: Kör bevakning
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python check_jobs.py --force
          else
            python check_jobs.py
          fi

      - name: Skicka mejl om nya annonser
        run: |
          SUBJECT=$(cat email_subject.txt)
          if [ -n "$SUBJECT" ]; then
            echo "Skickar mejl..."
            printf "From: Jobbbevakning <%s>\nTo: jari.asplund@tng.se\nSubject: %s\nMIME-Version: 1.0\nContent-Type: text/html; charset=utf-8\n\n" \
              "${{ secrets.MAIL_FROM }}" "$SUBJECT" > /tmp/email_message.txt
            cat email_body.txt >> /tmp/email_message.txt
            curl -s --url "smtps://smtp.gmail.com:465" \
              --ssl-reqd \
              --mail-from "${{ secrets.MAIL_FROM }}" \
              --mail-rcpt "jari.asplund@tng.se" \
              --mail-rcpt "anna.nydahl@tng.se" \
              --mail-rcpt "annika.jepsson@tng.se" \
              --mail-rcpt "charlotte.ulvros@tng.se" \
              --mail-rcpt "mathias.jonsson@adadigital.se" \
              --mail-rcpt "niklas.bragee@tng.se" \
              --mail-rcpt "par.johansson@tng.se" \
              --mail-rcpt "asa.edman@tng.se" \
              --mail-rcpt "johan.nilsson@tng.se" \
              --mail-rcpt "tomas.larsson@tng.se" \
              --mail-rcpt "emil.lindberg@tng.se" \
              --user "${{ secrets.MAIL_FROM }}:${{ secrets.MAIL_PASSWORD }}" \
              -T /tmp/email_message.txt
            echo "Mejl skickat"
          else
            echo "Inga nya annonser – inget mejl skickas"
          fi

      - name: Spara uppdaterad cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "Uppdatera jobbcache $(date '+%Y-%m-%d')"
          git push
