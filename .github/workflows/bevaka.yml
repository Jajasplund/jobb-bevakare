name: Jobbannons-bevakning

on:
  schedule:
    - cron: '0 7 * * 1'  # Varje måndag kl 07:00
  workflow_dispatch:
    inputs:
      force:
        description: 'Visa alla nuvarande jobb (används vid lansering)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  bevaka:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repo
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Installera Playwright-webbläsare
        run: playwright install chromium --with-deps

      - name: Kör bevakning
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python check_jobs.py --force
          else
            python check_jobs.py
          fi

      - name: Skicka mejl om nya annonser
        run: |
          SUBJECT=$(cat email_subject.txt)
          BODY=$(cat email_body.txt)
          if [ -n "$SUBJECT" ]; then
            echo "Skickar mejl..."
            curl -s --url "smtps://smtp.gmail.com:465" \
              --ssl-reqd \
              --mail-from "${{ secrets.MAIL_FROM }}" \
              --mail-rcpt "jari.asplund@tng.se" \
              --user "${{ secrets.MAIL_FROM }}:${{ secrets.MAIL_PASSWORD }}" \
              -T <(echo -e "From: Jobbbevakning <${{ secrets.MAIL_FROM }}>\nTo: jari.asplund@tng.se\nSubject: $SUBJECT\n\n$BODY")
            echo "Mejl skickat"
          else
            echo "Inga nya annonser – inget mejl skickas"
          fi

      - name: Spara uppdaterad cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "Uppdatera jobbcache $(date '+%Y-%m-%d')"
          git push
